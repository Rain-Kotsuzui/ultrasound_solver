# 此模板仅用于 dry-run 编码；在测得板卡映射和相位校准前，禁止用于 live 发送。
schema_version: 1
name: "coreep4ce6-256-unverified"
board_model: "coreep4ce6"
protocol: "fpga_256"
solver_channels: 256

# 自动读取 third_party/SonicSurface 中供应商给出的 EMITTERS_ORDER。
# 它是 16 x 16 默认 PCB 的 solver index -> FPGA index 映射；实测验证前
# mapping_verified 必须保持 false。若实物布线不同，改为显式 256 项排列。
solver_to_device: "vendor_sonicsurface_16x16"
mapping_verified: false

# 完成相位坡度验证后，在此添加 256 个实测 phase_offsets_rad。
phase_sign: 1
global_phase_offset_rad: 0.0
disabled_device_channels: []

serial:
  port: null
  baudrate: 230400
