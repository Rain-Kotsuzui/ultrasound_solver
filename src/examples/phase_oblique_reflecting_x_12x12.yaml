mode: "inverse"

physics:
  sound_speed: 343.0
  medium_density: 1.21

transducer_specs:
  frequency: 40000.0
  spl_db: 115.0
  spl_distance: 0.3
  diameter: 0.01
  pitch: 0.01
  array_n: 12

domain:
  box_size: [0.12, 0.12, 0.12]
  grid_size: [41, 41, 41]

solver:
  backend: "cudss_hybrid_direct"
  direct_residual_tol: 1.0e-4
  hybrid_num_threads: 1
  hybrid_execution_mode: "auto"
  hybrid_device_memory_limit_gb: 5.6
  hybrid_device_memory_reserve_gb: 0.75
  hybrid_register_cuda_memory: false
  condensed_symmetry_tolerance: 1.0e-12
  reuse_matrix: true

training:
  mode: "phase_only"
  loss_type: "focal_contrast"
  initial_phase: "response"
  compare_baseline: true
  phase_basis_file: "outputs/phase_oblique_reflecting_x_12x12/phase_response_basis.npy"
  phase_basis_batch_size: 12
  voxel_chunk_size: 131072
  load_basis_to_gpu: false
  release_factor_after_basis: true
  target_field_file: ""
  target_peak_pressure: 600.0
  target_sigma: 0.006
  background_pressure: 0.0
  target_weight: 1.0
  background_weight: 1.3
  target_radius: 0.008
  source_exclusion_layers: 4
  sidelobe_temperature: 5.0
  optimizer: "lbfgsb"
  learning_rate: 0.006
  iterations: 300
  gradient_check: true
  gradient_check_step: 1.0e-3

boundary_conditions:
  "-x": "open"
  "+x": "reflecting"
  "-y": "open"
  "+y": "open"
  "-z": "reflecting"
  "+z": "open"

targets:
  - point: [0.09, 0.09, 0.09]

io:
  output_file: "outputs/phase_oblique_reflecting_x_12x12/result.npz"
  auto_visualize: false
  colormap: "plasma"
