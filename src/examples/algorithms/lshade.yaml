mode: "phase_optimization"
algorithm: "lshade"
algorithm_options:
  population_size: 32
  min_population_size: 8
  memory_size: 6
  p_best_rate: 0.15
  convergence_patience: 25
  convergence_relative_tolerance: 2.0e-4

physics:
  sound_speed: 343.0
  medium_density: 1.21

transducer_specs:
  frequency: 40000.0
  spl_db: 115.0
  spl_distance: 0.3
  diameter: 0.01
  pitch: 0.01
  array_n: 12

domain:
  box_size: [0.12, 0.12, 0.12]
  grid_size: [41, 41, 41]

solver:
  backend: "cudss_hybrid_direct"
  reuse_matrix: true

training:
  loss_type: "focal_contrast"
  initial_phase: "geometric"
  phase_basis_file: "outputs/algorithm_examples/lshade_basis.npy"
  target_peak_pressure: 600.0
  target_sigma: 0.006
  background_weight: 1.3
  target_radius: 0.008
  source_exclusion_layers: 4
  sidelobe_temperature: 5.0
  iterations: 2000
  max_evaluations: 15000
  max_seconds: 180.0
  seed: 0

boundary_conditions:
  "-x": "open"
  "+x": "reflecting"
  "-y": "open"
  "+y": "open"
  "-z": "reflecting"
  "+z": "open"

targets:
  - point: [0.09, 0.09, 0.09]

io:
  output_file: "outputs/algorithm_examples/lshade_result.npz"
  auto_visualize: false
