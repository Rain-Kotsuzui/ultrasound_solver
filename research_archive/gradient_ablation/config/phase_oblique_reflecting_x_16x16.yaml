mode: "phase_optimization"
algorithm: "adjoint"
algorithm_options:
  optimizer: "adam"
  learning_rate: 0.05

physics:
  sound_speed: 343.0
  medium_density: 1.21

transducer_specs:
  frequency: 40000.0
  spl_db: 115.0
  spl_distance: 0.3
  diameter: 0.01
  pitch: 0.01
  array_n: 16

domain:
  box_size: [0.16, 0.16, 0.16]
  grid_size: [55, 55, 55]

solver:
  backend: "cudss_hybrid_direct"
  direct_residual_tol: 1.0e-4
  hybrid_num_threads: 1
  hybrid_execution_mode: "auto"
  hybrid_device_memory_limit_gb: 5.6
  hybrid_device_memory_reserve_gb: 0.75
  hybrid_register_cuda_memory: false
  condensed_symmetry_tolerance: 1.0e-12
  reuse_matrix: true

training:
  loss_type: "focal_contrast"
  initial_phase: "geometric"
  compare_geometric: true
  phase_basis_file: "gradient_ablation/results/phase_oblique_reflecting_x_16x16/phase_response_basis.npy"
  phase_basis_batch_size: 16
  voxel_chunk_size: 131072
  load_basis_to_gpu: true
  release_factor_after_basis: true
  target_field_file: ""
  target_peak_pressure: 600.0
  target_sigma: 0.006
  background_pressure: 0.0
  target_weight: 1.0
  background_weight: 1.3
  target_radius: 0.008
  source_exclusion_layers: 4
  sidelobe_temperature: 5.0
  iterations: 300
  max_evaluations: 5000
  max_seconds: 0.0
  seed: 0
  show_loss_curve: true
  loss_curve_update_interval: 1
  loss_curve_pause_seconds: 0.01

boundary_conditions:
  "-x": "open"
  "+x": "reflecting"
  "-y": "open"
  "+y": "open"
  "-z": "reflecting"
  "+z": "open"

targets:
  - point: [0.12, 0.12, 0.12]

io:
  output_file: "gradient_ablation/results/phase_oblique_reflecting_x_16x16/result.npz"
  auto_visualize: false
  colormap: "plasma"
