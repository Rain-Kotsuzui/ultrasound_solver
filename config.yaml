mode: "baseline"             # baseline / inverse

# 1. 背景物理介质参数 (20°C 空气)
physics:
  sound_speed: 343.0         # 介质声速 c0 (m/s)
  medium_density: 1.21       # 空气密度 rho0 (kg/m^3)

# 2. 超声波换能器硬件参数
transducer_specs:
  frequency: 40000.0         # 换能器工作频率 f (Hz), 40 kHz
  spl_db: 115.0              # 灵敏度/声压级 SPL (dB)
  spl_distance: 0.3          # 标定测试距离 (m), 0.3m (30cm)
  diameter: 0.01           # 换能器有效振动直径 D (m), 10mm
  pitch: 0.01              # 阵元中心间距 (m), 10mm
  array_n: 9               

# 3. 计算区域与空间离散网格
domain:
  box_size: [0.1, 0.1, 0.1]  # 物理空间总边长 [Lx, Ly, Lz] (m)
  grid_size: [108, 108, 108]       # 三维网格点数 [Nx, Ny, Nz] 

# 4. 线性求解器配置
solver:
  backend: "cudss_hybrid_direct"   # gpu_iterative / gpu_direct / cudss_hybrid_direct
  direct_residual_tol: 1.0e-4      # 直接法结果的相对残差上限
  hybrid_num_threads: 1            # Windows 下稳定的 cuDSS hybrid CPU 线程数
  hybrid_execution_mode: "auto"    # auto / hybrid_execute / hybrid_memory
  hybrid_device_memory_limit_gb: 5.6 # HMM 最多使用的 GPU 显存
  hybrid_device_memory_reserve_gb: 0.75 # 为 Warp、CUDA 上下文和显示系统预留显存
  hybrid_register_cuda_memory: false # Windows 下禁用主存注册以提高稳定性
  condensed_symmetry_tolerance: 1.0e-12 # 约化矩阵复对称性检查阈值
  gmres_restart: 30                # GPU GMRES 每轮 Krylov 子空间大小
  gmres_maxiter: 3000              # GPU GMRES 最大重启轮数
  gmres_rtol: 1.0e-6               # 缩放系统相对残差阈值
  gmres_backward_error_tol: 1.0e-4 # 原系统后向误差阈值
  reuse_matrix: true               # 仅相位变化时跳过矩阵与介质场重装配

# 5. 逆向训练配置
training:
  mode: "phase_only"               # phase_only / obstacle_distribution
  phase_basis_file: "phase_response_basis.npy"
  phase_basis_batch_size: 8        # 每批构建的阵元 RHS 数
  voxel_chunk_size: 262144         # CPU 合成与 VJP 的体素分块大小
  load_basis_to_gpu: true          # 构建后将响应基常驻 GPU
  release_factor_after_basis: true # 构建完成后释放 cuDSS 因子

# 6. 6 面边界条件 (reflecting: 刚性全反射 | open: 自由辐射 Sommerfeld ABC)
boundary_conditions:
  "-x": "open"         # 左侧面
  "+x": "open"         # 右侧面
  "-y": "open"         # 后侧面
  "+y": "open"         # 前侧面
  "-z": "reflecting"         # 底面除阵元外的挡板区域
  "+z": "open"               # 顶面自由辐射

# 7. 多目标焦点物理坐标 [x, y, z] (m)
targets:
  - point: [0.05, 0.05, 0.05]     # 目标点 1: 空间几何中心

# 8. 基于材料物性的 SDF 场景障碍物
# obstacles:
#   - type: "sphere"
#     center: [0.040, 0.040, 0.022]     # 球心位置
#     radius: 0.012                      # 半径 1.2 cm
#     material:
#       density: 1250.0                  # 密度 rho (kg/m^3)
#       sound_speed: 2200.0              # 纵波声速 c (m/s)

# 9. 输出与交互
io:
  output_file: "ultrasound_field.npz"
  auto_visualize: true
  colormap: "plasma"
