mode: "baseline"             # baseline / inverse

# 1. 背景物理介质参数 (20°C 空气)
physics:
  sound_speed: 343.0         # 介质声速 c0 (m/s)
  medium_density: 1.21       # 空气密度 rho0 (kg/m^3)

# 2. 超声波换能器硬件参数
transducer_specs:
  frequency: 40000.0         # 换能器工作频率 f (Hz), 40 kHz
  spl_db: 115.0              # 灵敏度/声压级 SPL (dB)
  spl_distance: 0.3          # 标定测试距离 (m), 0.3m (30cm)
  diameter: 0.01           # 换能器有效振动直径 D (m), 10mm
  pitch: 0.01              # 阵元中心间距 (m), 10mm
  array_n: 9               

# 3. 计算区域与空间离散网格
domain:
  box_size: [0.1, 0.1, 0.1]  # 物理空间总边长 [Lx, Ly, Lz] (m)
  grid_size: [108, 108, 108]       # 三维网格点数 [Nx, Ny, Nz] 

# 4. 线性求解器配置
solver:
  backend: "gpu_iterative"         # gpu_iterative / nested_schur_direct / gpu_direct / cpu_direct
  gmres_restart: 30                # GPU GMRES 每轮 Krylov 子空间大小
  gmres_maxiter: 3000              # GPU GMRES 最大重启轮数
  gmres_rtol: 1.0e-6               # 缩放系统相对残差阈值
  gmres_backward_error_tol: 1.0e-4 # 原系统后向误差阈值
  leaf_dofs: 4096                  # Schur: 递归叶子块最大自由度
  min_axis_size: 3                 # Schur: 允许继续切分的最小轴长度
  schur_block_size: 256            # Schur: 构造 Schur 补时的列分块大小
  dense_backend: "gpu"             # Schur: separator dense LU 后端: cpu / gpu
  gpu_min_separator_dofs: 512      # Schur: separator 规模达到该阈值才使用 GPU LU
  reuse_factorization: true        # Schur: 相位优化时复用因子，仅更新 RHS 并回代
  parallel_depth: 1                # Schur: 并行构造子树的递归深度
  profile_print_depth: 0           # Schur: 打印前几层实时耗时；0 只打印顶层

# 5. 6 面边界条件 (reflecting: 刚性全反射 | open: 自由辐射 Sommerfeld ABC)
boundary_conditions:
  "-x": "open"         # 左侧面
  "+x": "open"         # 右侧面
  "-y": "open"         # 后侧面
  "+y": "open"         # 前侧面
  "-z": "reflecting"         # 底面除阵元外的挡板区域
  "+z": "open"               # 顶面自由辐射

# 6. 多目标焦点物理坐标 [x, y, z] (m)
targets:
  - point: [0.05, 0.05, 0.05]     # 目标点 1: 空间几何中心

# 7. 基于材料物性的 SDF 场景障碍物
# obstacles:
#   - type: "sphere"
#     center: [0.040, 0.040, 0.022]     # 球心位置
#     radius: 0.012                      # 半径 1.2 cm
#     material:
#       density: 1250.0                  # 密度 rho (kg/m^3)
#       sound_speed: 2200.0              # 纵波声速 c (m/s)

# 8. 输出与交互
io:
  output_file: "ultrasound_field.npz"
  auto_visualize: true
  colormap: "plasma"
